name: Frontend Deploy

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download CI build artifact
        id: download
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: stwmovers-frontend

      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome != 'success'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stwmovers-frontend/package-lock.json

      - name: Build
        if: github.event_name == 'workflow_dispatch' || steps.download.outcome != 'success'
        working-directory: stwmovers-frontend
        run: |
          npm ci
          npm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: ${{ secrets.NUXT_PUBLIC_API_BASE_URL }}
          NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NUXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NUXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLIC_KEY }}

      - name: Verify build output
        run: |
          if [ ! -f stwmovers-frontend/.output/server/index.mjs ]; then
            echo "Missing stwmovers-frontend/.output/server/index.mjs"
            ls -la stwmovers-frontend/.output 2>/dev/null || ls -la stwmovers-frontend/ || true
            exit 1
          fi

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_FRONTEND_PATH: ${{ secrets.VPS_FRONTEND_PATH }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "Set VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_FRONTEND_PATH in GitHub production environment."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            stwmovers-frontend/.output/ "$VPS_USER@$VPS_HOST:${VPS_FRONTEND_PATH:-/opt/stwmovers/frontend}/.output/"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "systemctl restart stwmovers-frontend"
