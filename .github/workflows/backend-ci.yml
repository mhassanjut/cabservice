name: Backend CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'stwmovers-backend/**'
      - '.github/workflows/backend-*.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'stwmovers-backend/**'
      - '.github/workflows/backend-*.yml'

defaults:
  run:
    working-directory: stwmovers-backend

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B test
      - name: Build JAR
        run: mvn -B -DskipTests package
      - name: Upload JAR artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: stwmovers-backend/target/stwmovers-backend-*.jar
          retention-days: 7

  verify-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stwmovers
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Flyway migrations on fresh database
        run: >
          mvn -B flyway:migrate
          -Dflyway.url=jdbc:postgresql://localhost:5432/stwmovers
          -Dflyway.user=postgres
          -Dflyway.password=test
