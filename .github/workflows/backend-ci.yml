name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'stwmovers-backend/**'
      - '.github/workflows/backend-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'stwmovers-backend/**'
      - '.github/workflows/backend-*.yml'

defaults:
  run:
    working-directory: stwmovers-backend

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B test
      - name: Build JAR
        run: mvn -B -DskipTests package
      - name: Upload JAR artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: stwmovers-backend/target/stwmovers-backend-*.jar
          retention-days: 7
