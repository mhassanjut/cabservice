name: Frontend CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'stwmovers-frontend/**'
      - '.github/workflows/frontend-*.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'stwmovers-frontend/**'
      - '.github/workflows/frontend-*.yml'

defaults:
  run:
    working-directory: stwmovers-frontend

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frontend package files
        run: |
          test -f package.json || {
            echo "Missing package.json in stwmovers-frontend."
            ls -la
            exit 1
          }
          test -f package-lock.json || {
            echo "Missing package-lock.json in stwmovers-frontend."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stwmovers-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: https://api.stwmovers.com
          NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder
          NUXT_PUBLIC_STRIPE_PUBLIC_KEY: ci-placeholder

  production-build:
    needs: typecheck-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: stwmovers-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stwmovers-frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build for production deploy
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE_URL: ${{ secrets.NUXT_PUBLIC_API_BASE_URL }}
          NUXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NUXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NUXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ secrets.NUXT_PUBLIC_STRIPE_PUBLIC_KEY }}
          NUXT_PUBLIC_COOKIE_AUTH: ${{ secrets.NUXT_PUBLIC_COOKIE_AUTH }}
          NUXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ secrets.NUXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
          NUXT_PUBLIC_MICROSOFT_CLARITY_ID: ${{ secrets.NUXT_PUBLIC_MICROSOFT_CLARITY_ID }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-output
          path: stwmovers-frontend/.output
          retention-days: 7
