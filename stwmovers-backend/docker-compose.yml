# DOCKER-DISABLED: Full stack compose inactive. Active deployment: mvn spring-boot:run or java -jar (see MIGRATION-NOTES.md).
# Re-enable: uncomment redis, api, and nginx services below; restore Dockerfile and CI docker job.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stwmovers
      POSTGRES_USER: stwmovers
      POSTGRES_PASSWORD: stwmovers
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stwmovers"]
      interval: 5s
      timeout: 5s
      retries: 10

