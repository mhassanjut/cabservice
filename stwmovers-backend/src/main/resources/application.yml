spring:
  application:
    name: stwmovers-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stwmovers}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:toor@123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  # REDIS-CONFIG-PRESERVED: Redis connection (OTP now in-memory). Re-enable: uncomment block, restore Redis starter, RedisConfig, and RedisOtpStore Redis calls.
  # data:
  #   redis:
  #     host: ${REDIS_HOST:localhost}
  #     port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
            trust: ${MAIL_HOST:smtp-relay.brevo.com}
        debug: ${MAIL_DEBUG:false}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-for-production-use}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:${JWT_EXPIRATION_MS:86400000}}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cookie:
    secure: ${COOKIE_SECURE:false}
  security:
    csrf-enabled: ${CSRF_ENABLED:false}
  barcelona:
    # Barcelona + El Prat (08820) + BCN airport (~41.297, 2.078)
    min-lat: 41.270
    max-lat: 41.469
    min-lng: 2.052
    max-lng: 2.228
  fare:
    in-city-base-km: 27
    in-city-extra-eur-per-km: 1
  otp:
    ttl-seconds: 600
    length: 6
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/confirm}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/payment?cancelled=1}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-requests-per-minute: ${RATE_LIMIT_MAX_PER_MINUTE:600}
  admin:
    email: ${ADMIN_EMAIL:admin@stwmovers.com}
    password: ${ADMIN_PASSWORD:Admin@12345}
  uploads:
    cars-dir: ${CAR_UPLOADS_DIR:uploads/cars}
    tours-dir: ${TOUR_UPLOADS_DIR:uploads/tours}

management:
  endpoints:
    web:
      exposure:
        include: health,info
